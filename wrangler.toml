# Cloudflare Pages: the web app (dist) plus the AI service at /api/ai (functions/).
# Company setup and deploy steps: docs/web-auth-setup.md.
name = "takeoff-ai"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Legacy standalone access-code request counts (company mode uses Postgres).
# Create only when using the legacy proxy:
#   npx wrangler kv namespace create USAGE
# and paste the id it prints here.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "YOUR_NAMESPACE_ID"

[vars]
# Any OpenAI-compatible endpoint. OpenRouter reaches Gemini, Qwen, GPT, Claude and others with one key.
AI_BASE_URL = "https://openrouter.ai/api/v1"
# A vision model's id from openrouter.ai/models. Pick the cheapest one that scores well
# on your legends (More > Show bid workbook scoring, then Score against bid workbook).
AI_MODEL = "google/gemini-3.8-flash"
# Cheaper model just for reading sheet names from title blocks.
AI_MODEL_SHEET_NAME = "google/gemini-3.1-flash-lite"
# Requests per employee per day, and across everyone per day.
DAILY_LIMIT = "25"
GLOBAL_DAILY_LIMIT = "200"
# Company-wide daily cap (also bounded by GLOBAL_DAILY_LIMIT).
ORG_DAILY_LIMIT = "100"

# Secrets (never in this file):
#   npx wrangler pages secret put AI_API_KEY      the provider key (OpenRouter)
#   npx wrangler pages secret put SUPABASE_URL
#   npx wrangler pages secret put SUPABASE_ANON_KEY
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler pages secret put APP_URL         exact production HTTPS origin
